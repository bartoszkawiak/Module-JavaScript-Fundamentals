<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>My form exercise</title>
    <meta name="description" content="" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
  </head>
  <body>
    <header>
      <h1>Product Pick</h1>
    </header>
    <main>
      <form>
        <!--Customer name min 2 characters-->
        <div>
          <label for="name">Name</label>
          <input type="text" name="name" id="name" minlength="2" required placeholder="Jon">
        </div>
        <!-- Email-->
        <div>
          <label for="email">Email</label>
          <input type="email" name="email" id="email" required placeholder="email@email.com">
        </div>
        <!--Color 3 options radio-->
        <div>
          <label for="color">Color</label>
          <input type="radio" name="color-selected" id="color-red" required value="red">
          <input type="radio" name="color-selected" id="color-blue" value="blue">
          <input type="radio" name="color-selected" id="color-white" value="white">
        </div>
        <!--Size 6 options select-->
        <div>
          <label for="size">Size</label>
          <select>
            <option value="XS">XS</option>
            <option value="S">S</option>
            <option value="M">M</option>
            <option value="L">L</option>
            <option value="XL">XL</option>
            <option value="XXL">XXL</option>
          </select> 
        </div>

        <!--try writing out the requirements first as comments
        this will also help you fill in your PR message later-->
      </form>
    </main>
    <footer>
      <!-- change to your name-->
      <p>By Bartosz Kawiak</p>
    </footer>
  </body>
</html>
